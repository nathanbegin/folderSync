name: Build Windows exe

on:
  push:
    paths: ["VERSION"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --onefile --windowed --hidden-import pystray._win32 --name FolderSync foldersync.py
      - uses: actions/upload-artifact@v4
        with:
          name: FolderSync-windows
          path: dist/FolderSync.exe
      - name: Publish release (si la version n'existe pas déjà)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(tr -d '[:space:]' < VERSION)"
          if gh release view "$v" >/dev/null 2>&1; then
            echo "$v existe déjà : pas de nouvelle release (changez VERSION pour en publier une)."
          else
            gh release create "$v" dist/FolderSync.exe --target "${{ github.sha }}" --generate-notes
          fi
