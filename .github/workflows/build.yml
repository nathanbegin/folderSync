name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install pyinstaller
          pyinstaller --onefile --windowed --name FolderSync foldersync.py
      - uses: actions/upload-artifact@v4
        with:
          name: FolderSync-windows
          path: dist/FolderSync.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/FolderSync.exe --generate-notes
